<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height:100vh;
        }
        .navbar{
            position:sticky;
            top: 0;
        }
        .relative{
            border:2px solid green;
            position:relative;
            height:50vh;
            margin-top:20px;
        }
        .absolute{
            border:2px solid red;
            position:absolute;
            margin: 10px;
            margin-left: 50px;
        }
        .fixed{
            position:fixed;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
                <li>Service</li>
            </ul>
        </nav>
    </div>
    <div class="relative">
        <h1>Relative</h1>
        <div class="absolute">
            <h1>Absolute</h1>
        </div>
    </div>
    <div class="fixed">fixed</div>
        
</body>
</html>
